<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>工作台</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FAFAFA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --background: #FAFAFA;
    --foreground: #0F172A;
    --muted: #F1F5F9;
    --muted-foreground: #64748B;
    --accent: #0052FF;
    --accent-secondary: #4D7CFF;
    --accent-foreground: #FFFFFF;
    --border: #E2E8F0;
    --card: #FFFFFF;
    --ring: #0052FF;
    --font-sans: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
    --font-display: 'Calistoga', Georgia, 'Songti SC', serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
    --gradient: linear-gradient(135deg, #0052FF, #4D7CFF);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
    --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
    --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.08);
    --shadow-accent: 0 4px 14px rgba(0, 82, 255, 0.25);
    --shadow-accent-lg: 0 8px 24px rgba(0, 82, 255, 0.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }

  body {
    font-family: var(--font-sans);
    background: var(--background);
    color: var(--foreground);
    overflow: hidden;
    user-select: none;
  }

  button, input { font-family: inherit; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 22px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }

  .checkin { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }

  .checkin-btn {
    border: none;
    border-radius: 12px;
    background: var(--gradient);
    color: var(--accent-foreground);
    font-size: 15px;
    font-weight: 600;
    padding: 11px 20px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
  }
  .checkin-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-accent); }
  .checkin-btn:active { transform: scale(0.98); }
  .checkin-btn.checked { background: var(--muted); color: var(--muted-foreground); box-shadow: none; }
  .checkin-btn:disabled { cursor: not-allowed; opacity: 0.7; transform: none; }

  .checkin-sub { font-size: 13px; color: var(--muted-foreground); }

  .quote-top { flex: 1; text-align: right; min-width: 0; }
  .quote-top .q-date {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted-foreground);
  }
  .quote-top .q-text {
    font-size: 15px;
    font-weight: 600;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .layout {
    display: flex;
    height: calc(100vh - 68px);
    gap: 16px;
    padding: 40px 24px 24px;
  }

  .nav {
    width: 160px;
    flex: 0 0 160px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px 12px;
    box-shadow: var(--shadow-sm);
  }

  .nav-brand { padding: 4px 12px 16px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .nav-brand .brand-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .nav-brand .brand-title { font-size: 23px; font-weight: 700; letter-spacing: -0.01em; }

  .nav-item {
    border: none;
    background: transparent;
    color: var(--muted-foreground);
    text-align: left;
    padding: 12px 14px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .nav-item:hover { background: var(--muted); color: var(--foreground); }
  .nav-item.active { background: var(--gradient); color: #fff; font-weight: 600; box-shadow: var(--shadow-accent); }

  .content { flex: 1; min-width: 0; overflow: auto; }
  .page { display: none; height: 100%; }
  .page.active { display: block; }

  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 22px;
  }
  .page-head h2 { margin: 6px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }

  .section-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .section-label .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulseDot 2s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.6; }
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 16px;
    height: auto;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    overflow: auto;
    min-height: 0;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.25s ease;
  }
  .card:hover { box-shadow: var(--shadow-lg); }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; letter-spacing: -0.01em; }

  .todo-add { display: flex; gap: 8px; margin-bottom: 10px; }
  .todo-add input { flex: 1; min-width: 0; }

  input[type="text"], input[type="date"] {
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--foreground);
    font-size: 14px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  input[type="text"]:focus, input[type="date"]:focus {
    outline: none;
    border-color: var(--ring);
    box-shadow: 0 0 0 3px rgba(0, 82, 255, 0.12);
  }
  input::placeholder { color: var(--muted-foreground); }

  .mini-btn {
    border: none;
    border-radius: 10px;
    background: var(--gradient);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 16px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
  }
  .mini-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-accent); }
  .mini-btn:active { transform: scale(0.98); }
  .mini-btn.ghost {
    background: var(--card);
    color: var(--foreground);
    border: 1px solid var(--border);
    box-shadow: none;
  }
  .mini-btn.ghost:hover { background: var(--muted); box-shadow: var(--shadow-sm); }

  .list { display: flex; flex-direction: column; gap: 8px; overflow: auto; min-height: 0; }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--muted);
    border-radius: 12px;
    padding: 11px 12px;
  }
  .row .grow { flex: 1; min-width: 0; }
  .row .muted { font-size: 12px; color: var(--muted-foreground); }
  .row .del { background: none; border: none; color: var(--muted-foreground); cursor: pointer; font-size: 16px; }
  .row .del:hover { color: var(--foreground); }

  .empty { color: var(--muted-foreground); font-size: 14px; line-height: 1.6; padding: 10px 0; }

  .todo-card { grid-column: 1; grid-row: 1; }
  .countdown-card { grid-column: 1; grid-row: 2; }

  .card.reaction-merge {
    grid-column: 2;
    grid-row: 1 / span 2;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    align-items: stretch;
  }

  .reaction-zone {
    border-radius: 14px;
    background: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
    min-height: 100%;
    transition: background 0.16s ease;
  }
  .reaction-zone.is-wait { background: #EF4444; color: #fff; }
  .reaction-zone.is-go { background: #10B981; color: #fff; }

  .records-zone { display: flex; flex-direction: column; min-height: 0; overflow: auto; }

  .re-progress { font-size: 15px; font-weight: 600; }
  .re-btn {
    width: 140px; height: 140px; border-radius: 50%;
    border: none; cursor: pointer; background: #fff; color: var(--foreground);
    font-size: 20px; font-weight: 700; margin: 12px 0; box-shadow: var(--shadow-md);
  }
  .reaction-zone.is-go .re-btn { animation: pulse 0.85s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
  .re-hint { font-size: 14px; min-height: 20px; }
  .re-last { font-size: 14px; font-weight: 600; min-height: 20px; }
  .re-summary { font-size: 13px; margin-top: 8px; line-height: 1.6; opacity: 0.9; }

  .finance { display: flex; flex-direction: column; gap: 14px; }
  .finance-main {
    display: block; text-align: center; background: var(--gradient); color: #fff;
    border-radius: 14px; padding: 18px; font-size: 17px; font-weight: 600;
    text-decoration: none; box-shadow: var(--shadow-sm); transition: all 0.2s ease;
  }
  .finance-main:hover { transform: translateY(-2px); box-shadow: var(--shadow-accent); }
  .finance-links { display: flex; flex-wrap: wrap; gap: 12px; }
  .finance-links a {
    flex: 1; min-width: 120px; text-align: center; text-decoration: none; color: var(--foreground);
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px;
    box-shadow: var(--shadow-sm); transition: all 0.2s ease;
  }
  .finance-links a:hover { transform: translateY(-2px); border-color: rgba(0,82,255,0.35); box-shadow: var(--shadow-accent); }
  .finance-note { font-size: 13px; color: var(--muted-foreground); line-height: 1.7; }

  .course-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 10px; }
  .course-day {
    background: var(--muted); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 6px; text-align: center; font-size: 13px; color: var(--muted-foreground);
  }
  .course-empty { margin-top: 18px; font-size: 14px; color: var(--muted-foreground); }

  .modal {
    position: fixed; inset: 0; background: rgba(15,23,42,0.5);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 24px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 13px;
    box-shadow: var(--shadow-lg);
  }
  .modal-title { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .modal-desc { font-size: 14px; color: var(--muted-foreground); line-height: 1.6; margin: 0; }

  @media (max-width: 900px) {
    body { overflow: auto; }
    .topbar { flex-direction: column; align-items: stretch; }
    .quote-top { text-align: left; }
    .layout { flex-direction: column; height: auto; }
    .nav { width: 100%; flex-direction: row; overflow-x: auto; }
    .nav-brand { display: none; }
    .nav-item { white-space: nowrap; }
    .content { overflow: visible; }
    .grid { grid-template-columns: 1fr; grid-template-rows: none; height: auto; }
    .todo-card, .countdown-card, .card.reaction-merge { grid-column: auto; grid-row: auto; }
    .card.reaction-merge { grid-template-columns: 1fr; }
    .card { min-height: 280px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="checkin">
      <button class="checkin-btn" id="checkinBtn">签到</button>
      <div class="checkin-sub" id="checkinSub">连续签到 0 天</div>
    </div>
    <div class="quote-top">
      <div class="q-date" id="quoteDate"></div>
      <div class="q-text" id="quoteText"></div>
    </div>
  </div>

  <div class="layout">
    <aside class="nav">
      <div class="nav-brand">
        <div class="brand-label">Workbench</div>
        <div class="brand-title">工作台</div>
      </div>
      <button class="nav-item active" data-page="workbench">工作台</button>
      <button class="nav-item" data-page="notes">文献笔记</button>
      <button class="nav-item" data-page="finance">今日财经热点</button>
      <button class="nav-item" data-page="courses">课程表</button>
    </aside>

    <main class="content">
      <section class="page active" id="page-workbench">
        <div class="page-head">
          <div>
            <span class="section-label"><span class="dot"></span>Workbench</span>
            <h2>工作台</h2>
          </div>
        </div>
        <div class="grid">
          <div class="card todo-card">
            <div class="card-title">今日待办</div>
            <div class="todo-add">
              <input type="text" id="todoInput" placeholder="添加待办…">
              <button class="mini-btn" id="todoAdd">添加</button>
            </div>
            <div class="list" id="todoList"></div>
          </div>

          <div class="card reaction-merge" id="reactionCard">
            <div class="reaction-zone" id="reactionZone">
              <div class="re-progress" id="reProgress">点击开始 7 次测试</div>
              <button class="re-btn" id="reBtn">开始测试</button>
              <div class="re-hint" id="reHint">红色等待，变绿点击</div>
              <div class="re-last" id="reLast"></div>
              <div class="re-summary" id="reSummary"></div>
            </div>
            <div class="records-zone">
              <div class="card-title">每日记录</div>
              <div class="list" id="recordList"></div>
            </div>
          </div>

          <div class="card countdown-card">
            <div class="card-title">时间记录</div>
            <button class="mini-btn" id="cdAddBtn">添加倒数日</button>
            <div class="list" id="cdList" style="margin-top:10px;"></div>
          </div>
        </div>
      </section>

      <section class="page" id="page-notes">
        <div class="page-head">
          <div>
            <span class="section-label"><span class="dot"></span>Library</span>
            <h2>文献笔记</h2>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="mini-btn" id="noteUploadBtn">上传文档</button>
            <button class="mini-btn ghost" id="noteRefreshBtn">刷新</button>
          </div>
        </div>
        <input type="file" id="noteFile" multiple hidden>
        <div class="list" id="noteList"></div>
      </section>

      <section class="page" id="page-finance">
        <div class="page-head">
          <div>
            <span class="section-label"><span class="dot"></span>Finance</span>
            <h2>今日财经热点</h2>
          </div>
        </div>
        <div class="finance">
          <a class="finance-main" href="https://finance.sina.com.cn" target="_blank" rel="noopener">打开新浪财经</a>
          <div class="finance-links">
            <a href="https://finance.sina.com.cn/stock/" target="_blank" rel="noopener">股票</a>
            <a href="https://finance.sina.com.cn/fund/" target="_blank" rel="noopener">基金</a>
            <a href="https://finance.sina.com.cn/money/forex/" target="_blank" rel="noopener">外汇</a>
            <a href="https://finance.sina.com.cn/roll/" target="_blank" rel="noopener">财经要闻</a>
          </div>
          <div class="finance-note">新浪财经不允许网页直接读取它的新闻内容，所以这里保留一键入口和常用频道，点击即可在新窗口查看。</div>
        </div>
      </section>

      <section class="page" id="page-courses">
        <div class="page-head">
          <div>
            <span class="section-label"><span class="dot"></span>Schedule</span>
            <h2>课程表</h2>
          </div>
          <button class="mini-btn" id="courseImportBtn">导入课表</button>
        </div>
        <div class="course-grid" id="courseGrid"></div>
        <div class="course-empty" id="courseEmpty">还没有课程，点击“导入课表”添加（导入功能即将上线）。</div>
      </section>
    </main>
  </div>

  <div class="modal" id="codeModal">
    <div class="modal-box">
      <div class="modal-title">设置同步口令</div>
      <p class="modal-desc">在每台设备上输入同一个口令，数据就会同步到一起。</p>
      <input type="text" id="codeInput" maxlength="24" placeholder="例如：gongzuotai2026">
      <button class="mini-btn" id="codeSave">保存并开始同步</button>
    </div>
  </div>

  <div class="modal" id="countdownModal">
    <div class="modal-box">
      <div class="modal-title">添加时间记录</div>
      <input type="text" id="cdTitle" maxlength="30" placeholder="例如：距离考试">
      <input type="date" id="cdDate">
      <div style="display:flex; gap:14px; font-size:14px;">
        <label><input type="radio" name="cdType" value="countdown" checked> 倒计时（还剩）</label>
        <label><input type="radio" name="cdType" value="countup"> 正计时（已经）</label>
      </div>
      <button class="mini-btn" id="cdSave">保存</button>
    </div>
  </div>

<script>

      '先完成，再完美。','小步快跑，胜过原地徘徊。','坚持不下去时，再坚持一下。',
      '心若向阳，无畏悲伤。','时间不会辜负每一个认真的人。','每天进步一点点，一年就是一大步。',
      '你只管努力，剩下的交给时间。','专注当下，静待花开。','山有顶峰，海有彼岸，努力自有回响。',
      '认真生活的你，值得被岁月温柔以待。','不积跬步，无以至千里。','相信自己，你比想象中更强大。',
      '成长，就是不断突破昨天的自己。','好运藏在坚持里。','别想太多，先做起来。',
      '每一次克制，都是成长。','保持热爱，奔赴山海。','稳住心态，你就赢了一半。',
      '当下即是最好的开始。','努力不一定立刻有结果，但一定在变好。','把简单的事做好，就是不简单。',
      '愿你不负时光，不负自己。'
    ];
    function renderQuote() {
      var now = new Date();
      var start = new Date(now.getFullYear(), 0, 0);
      var idx = Math.floor((now - start) / 86400000);
      var week = ['日','一','二','三','四','五','六'][now.getDay()];
      document.getElementById('quoteDate').textContent = (now.getMonth()+1) + '月' + now.getDate() + '日 星期' + week;
      document.getElementById('quoteText').textContent = QUOTES[idx % QUOTES.length];
    }

    var checkinBtn = document.getElementById('checkinBtn');
    var checkinSub = document.getElementById('checkinSub');

    function computeStreak(days) {
      var set = new Set(days);
      var d = new Date();
      if (!set.has(todayKey())) d.setDate(d.getDate() - 1);
      var streak = 0;
      while (set.has(fmtDay(d))) {
        streak++;
        d.setDate(d.getDate() - 1);
      }
      return streak;
    }

    function loadCheckin() {
      var code = getCode();
      if (!code) { checkinSub.textContent = '连续签到 0 天'; return Promise.resolve(); }
      return apiFetch('checkins?code=eq.' + enc(code) + '&select=day', 'GET').then(function (rows) {
        var days = (rows || []).map(function (r) { return r.day; });
        var checked = days.indexOf(todayKey()) >= 0;
        checkinSub.textContent = '连续签到 ' + computeStreak(days) + ' 天';
        checkinBtn.textContent = checked ? '今日已签到' : '签到';
        checkinBtn.disabled = checked;
        checkinBtn.classList.toggle('checked', checked);
      }).catch(function () {});
    }

    checkinBtn.addEventListener('click', function () {
      var code = getCode();
      if (!code) { showModal('codeModal'); return; }
      apiFetch('checkins', 'POST', { code: code, day: todayKey() }).then(loadCheckin).catch(function () {});
    });

    var todoInput = document.getElementById('todoInput');
    var todoList = document.getElementById('todoList');

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderTodos(rows) {
      todoList.innerHTML = '';
      if (!rows.length) { todoList.innerHTML = '<div class="empty">暂无待办</div>'; return; }
      rows.forEach(function (t) {
        var el = document.createElement('div');
        el.className = 'row';
        el.innerHTML =
          '<input type="checkbox" ' + (t.done ? 'checked' : '') + '>' +
          '<div class="grow" style="' + (t.done ? 'text-decoration:line-through;opacity:0.55;' : '') + '">' + esc(t.text) + '</div>' +
          '<button class="del">✕</button>';
        el.querySelector('input').addEventListener('change', function () {
          apiFetch('todos?id=eq.' + enc(t.id), 'PATCH', { done: !t.done }).then(loadTodos).catch(function () {});
        });
        el.querySelector('.del').addEventListener('click', function () {
          apiFetch('todos?id=eq.' + enc(t.id), 'DELETE').then(loadTodos).catch(function () {});
        });
        todoList.appendChild(el);
      });
    }

    function loadTodos() {
      var code = getCode();
      if (!code) { todoList.innerHTML = '<div class="empty">设置口令后使用</div>'; return Promise.resolve(); }
      return apiFetch('todos?code=eq.' + enc(code) + '&order=created_at.asc', 'GET')
        .then(renderTodos).catch(function () { todoList.innerHTML = '<div class="empty">待办加载失败</div>'; });
    }

    document.getElementById('todoAdd').addEventListener('click', function () {
      var text = todoInput.value.trim();
      if (!text) return;
      var code = getCode();
      if (!code) { showModal('codeModal'); return; }
      apiFetch('todos', 'POST', { code: code, text: text, done: false }).then(function () {
        todoInput.value = '';
        loadTodos();
      }).catch(function () {});
    });

    var cdList = document.getElementById('cdList');

    function daysBetween(dateStr) {
      var target = new Date(dateStr + 'T00:00:00');
      var today = new Date(); today.setHours(0,0,0,0);
      return Math.round((target - today) / 86400000);
    }

    function renderCountdowns(rows) {
      cdList.innerHTML = '';
      if (!rows.length) { cdList.innerHTML = '<div class="empty">还没有时间记录</div>'; return; }
      rows.forEach(function (c) {
        var diff = daysBetween(c.date);
        var label;
        if (c.type === 'countup') {
          label = '已经 ' + Math.abs(diff) + ' 天';
        } else {
          label = diff >= 0 ? '还有 ' + diff + ' 天' : '已过 ' + Math.abs(diff) + ' 天';
        }
        var el = document.createElement('div');
        el.className = 'row';
        el.innerHTML =
          '<div class="grow"><div>' + esc(c.title) + '</div><div class="muted">' + c.date + '</div></div>' +
          '<div style="font-weight:700;color:var(--accent);">' + label + '</div>' +
          '<button class="del">✕</button>';
        el.querySelector('.del').addEventListener('click', function () {
          apiFetch('countdowns?id=eq.' + enc(c.id), 'DELETE').then(loadCountdowns).catch(function () {});
        });
        cdList.appendChild(el);
      });
    }

    function loadCountdowns() {
      var code = getCode();
      if (!code) { cdList.innerHTML = '<div class="empty">设置口令后使用</div>'; return Promise.resolve(); }
      return apiFetch('countdowns?code=eq.' + enc(code) + '&order=date.asc', 'GET')
        .then(renderCountdowns).catch(function () {});
    }

    document.getElementById('cdAddBtn').addEventListener('click', function () {
      var code = getCode();
      if (!code) { showModal('codeModal'); return; }
      showModal('countdownModal');
    });
    document.getElementById('cdSave').addEventListener('click', function () {
      var title = document.getElementById('cdTitle').value.trim();
      var date = document.getElementById('cdDate').value;
      var type = document.querySelector('input[name="cdType"]:checked').value;
      if (!title || !date) return;
      var code = getCode();
      apiFetch('countdowns', 'POST', { code: code, title: title, date: date, type: type }).then(function () {
        hideModal('countdownModal');
        document.getElementById('cdTitle').value = '';
        document.getElementById('cdDate').value = '';
        loadCountdowns();
      }).catch(function () {});
    });

    var reactionZone = document.getElementById('reactionZone');
    var reBtn = document.getElementById('reBtn');
    var reHint = document.getElementById('reHint');
    var reLast = document.getElementById('reLast');
    var reProgress = document.getElementById('reProgress');
    var reSummary = document.getElementById('reSummary');
    var TOTAL = 7;
    var reState = 'idle';
    var reResults = [];
    var reTimer = null;
    var rePauseTimer = null;
    var reGoTime = 0;

    function clearReTimers() {
      if (reTimer) { clearTimeout(reTimer); reTimer = null; }
      if (rePauseTimer) { clearTimeout(rePauseTimer); rePauseTimer = null; }
    }
    function setReVisual(cls) {
      reactionZone.classList.remove('is-wait', 'is-go');
      if (cls) reactionZone.classList.add(cls);
    }
    function reProgressText() {
      if (reState === 'idle' || reState === 'done') return '点击开始 7 次测试';
      return '第 ' + (reResults.length + 1) + ' / ' + TOTAL + ' 次';
    }
    function beginReTrial() {
      clearReTimers();
      reState = 'wait';
      setReVisual('is-wait');
      reBtn.textContent = '等待…';
      reHint.textContent = '红色等待，别点';
      reLast.textContent = reResults.length ? '已完成 ' + reResults.length + ' 次' : '';
      reProgress.textContent = reProgressText();
      var delay = 2000 + Math.random() * 8000;
      reTimer = setTimeout(function () {
        reState = 'go';
        setReVisual('is-go');
        reBtn.textContent = '点！';
        reHint.textContent = '变绿了，快点击！';
        reGoTime = performance.now();
      }, delay);
    }
    function finishReRun() {
      clearReTimers();
      reState = 'done';
      setReVisual('');
      reBtn.textContent = '再测一轮';
      reHint.textContent = '本轮 7 次完成';
      reProgress.textContent = '本轮完成';
      var best = reResults.reduce(function (m, v) { return v < m ? v : m; }, Infinity);
      var avg = Math.round(reResults.reduce(function (a, b) { return a + b; }, 0) / reResults.length);
      reSummary.textContent = '本轮最快 ' + Math.round(best) + ' ms · 平均 ' + avg + ' ms';
      saveToday(reResults).then(loadRecords);
    }
    reBtn.addEventListener('click', function () {
      if (reState === 'idle' || reState === 'done') {
        reResults = [];
        reSummary.textContent = '';
        beginReTrial();
      } else if (reState === 'wait') {
        clearReTimers();
        reState = 'paused';
        setReVisual('');
        reBtn.textContent = '抢跑…';
        reHint.textContent = '别急，重新等待';
        rePauseTimer = setTimeout(beginReTrial, 1000);
      } else if (reState === 'go') {
        reResults.push(performance.now() - reGoTime);
        reLast.textContent = '第 ' + reResults.length + ' 次：' + Math.round(reResults[reResults.length - 1]) + ' ms';
        if (reResults.length < TOTAL) {
          reState = 'paused';
          setReVisual('');
          reBtn.textContent = '准备…';
          reProgress.textContent = reProgressText();
          rePauseTimer = setTimeout(beginReTrial, 1100);
        } else {
          finishReRun();
        }
      }
    });

    var recordList = document.getElementById('recordList');
    function formatDate(key) {
      var p = key.split('-');
      return parseInt(p[1], 10) + '月' + parseInt(p[2], 10) + '日';
    }
    function renderRecordRows(rows) {
      recordList.innerHTML = '';
      if (!rows.length) { recordList.innerHTML = '<div class="empty">还没有记录，测一轮后出现</div>'; return; }
      var tk = todayKey();
      rows.forEach(function (row) {
        var arr = row.times || [];
        if (!arr.length) return;
        var best = arr.reduce(function (m, v) { return v < m ? v : m; }, Infinity);
        var avg = Math.round(arr.reduce(function (a, b) { return a + b; }, 0) / arr.length);
        var el = document.createElement('div');
        el.className = 'row';
        el.innerHTML =
          '<div class="grow"><div>' + (row.day === tk ? '今天' : formatDate(row.day)) + '</div><div class="muted">' + arr.length + ' 次</div></div>' +
          '<div style="text-align:right;"><b>' + Math.round(best) + '</b><div class="muted">最快 ms</div></div>' +
          '<div style="text-align:right;"><b>' + avg + '</b><div class="muted">平均 ms</div></div>';
        recordList.appendChild(el);
      });
    }
    function loadRecords() {
      var code = getCode();
      if (!code) { recordList.innerHTML = '<div class="empty">设置口令后使用</div>'; return Promise.resolve(); }
      return apiFetch('records?code=eq.' + enc(code) + '&order=day.desc', 'GET')
        .then(renderRecordRows).catch(function () { recordList.innerHTML = '<div class="empty">加载失败</div>'; });
    }
    function saveToday(times) {
      var code = getCode();
      if (!code) return Promise.resolve();
      var day = todayKey();
      return apiFetch('records?code=eq.' + enc(code) + '&day=eq.' + day + '&select=id,times&limit=1', 'GET').then(function (rows) {
        if (rows && rows.length) {
          var merged = (rows[0].times || []).concat(times);
          if (merged.length > 2000) merged = merged.slice(-2000);
          return apiFetch('records?id=eq.' + enc(rows[0].id), 'PATCH', { times: merged });
        }
        return apiFetch('records', 'POST', { code: code, day: day, times: times });
      }).catch(function () {});
    }

    var noteList = document.getElementById('noteList');
    var noteFile = document.getElementById('noteFile');

    function notePublicUrl(path) {
      return STORAGE + 'object/public/notes/' + encPath(path);
    }

    function renderNotes(items) {
      noteList.innerHTML = '';
      if (!items.length) { noteList.innerHTML = '<div class="empty">还没有文档，点击“上传文档”添加</div>'; return; }
      items.forEach(function (item) {
        var name = item.name.split('/').pop();
        var ext = name.split('.').pop().toLowerCase();
        var canPreview = ['pdf','png','jpg','jpeg','gif','webp'].indexOf(ext) >= 0;
        var el = document.createElement('div');
        el.className = 'row';
        el.innerHTML =
          '<div class="grow"><div>' + esc(name) + '</div><div class="muted">' + ext.toUpperCase() + '</div></div>' +
          '<button class="mini-btn ghost">' + (canPreview ? '打开' : '下载') + '</button>' +
          '<button class="del">✕</button>';
        el.querySelector('.mini-btn').addEventListener('click', function () {
          window.open(notePublicUrl(item.name), '_blank');
        });
        el.querySelector('.del').addEventListener('click', function () {
          if (!confirm('删除这个文档？')) return;
          fetch(STORAGE + 'object/notes/' + encPath(item.name), {
            method: 'DELETE',
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
          }).then(loadNotes).catch(function () {});
        });
        noteList.appendChild(el);
      });
    }

    function loadNotes() {
      var code = getCode();
      if (!code) { noteList.innerHTML = '<div class="empty">设置口令后使用</div>'; return Promise.resolve(); }
      return fetch(STORAGE + 'object/list/notes', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ prefix: code + '/', limit: 100, sortBy: { column: 'name', order: 'asc' } })
      }).then(function (res) {
        if (!res.ok) throw new Error('list fail');
        return res.json();
      }).then(function (items) {
        renderNotes(items || []);
      }).catch(function () {
        noteList.innerHTML = '<div class="empty">文档加载失败</div>';
      });
    }

    document.getElementById('noteUploadBtn').addEventListener('click', function () {
      var code = getCode();
      if (!code) { showModal('codeModal'); return; }
      noteFile.click();
    });
    document.getElementById('noteRefreshBtn').addEventListener('click', loadNotes);
    noteFile.addEventListener('change', function () {
      var code = getCode();
      var files = Array.prototype.slice.call(noteFile.files || []);
      noteFile.value = '';
      var chain = Promise.resolve();
      files.forEach(function (file) {
        chain = chain.then(function () {
          var path = code + '/' + file.name;
          return fetch(STORAGE + 'object/notes/' + encPath(path), {
            method: 'POST',
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
              'Content-Type': file.type || 'application/octet-stream',
              'x-upsert': 'true'
            },
            body: file
          });
        });
      });
      chain.then(loadNotes).catch(function () { noteList.innerHTML = '<div class="empty">上传失败</div>'; });
    });

    var weekDays = ['周一','周二','周三','周四','周五','周六','周日'];
    var courseGrid = document.getElementById('courseGrid');
    weekDays.forEach(function (d) {
      var el = document.createElement('div');
      el.className = 'course-day';
      el.textContent = d;
      courseGrid.appendChild(el);
    });
    document.getElementById('courseImportBtn').addEventListener('click', function () {
      alert('课程导入功能即将上线，敬请期待。');
    });

    function loadAll() {
      loadCheckin();
      loadTodos();
      loadCountdowns();
      loadRecords();
      loadNotes();
    }

    renderQuote();
    ensureCode();
    loadAll();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/workbench/sw.js').catch(function () {});
      });
    }
  })();
</script>
</body>
</html>
